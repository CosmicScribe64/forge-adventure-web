# Checks every push to main and every pull request: the unit tests pass (scripts/unit-test, about a
# minute, before anything long starts), the Forge patch still applies, Forge and the
# game still compile, the SelfTest checks pass in headless Chromium, and the built game boots to
# its title screen without console errors (scripts/e2e-boot, on desktop and in phone emulation). These are readable builds. The
# minified build (TEAVM_OBFUSCATED=true) costs another 5 minutes for its own SelfTest compile, so
# pages.yml, which publishes releases, runs SelfTest and the e2e scenarios (desktop, phone and WebKit iPhone) against it. To
# check a change by hand: TEAVM_OBFUSCATED=true scripts/selftest.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch replaces a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check the wiki
        run: wiki/tools/lint

      - name: Run the unit tests
        run: scripts/unit-test

      - name: Clone Forge and apply the patch
        run: scripts/update-forge

      - name: Build Forge's jars
        run: scripts/build-forge-libs

      - name: Run Forge's own tests
        run: scripts/unit-test forge

      - name: Prepare the game data
        run: scripts/build-webdata

      - name: Run SelfTest
        run: scripts/selftest || { tail -60 out/selftest-js.log; exit 1; }

      - name: Compile the game
        run: scripts/build-web || { tail -40 web/build/teavm.log; exit 1; }

      - name: Boot smoke test
        run: scripts/e2e-boot || { tail -40 out/e2e-boot.log; exit 1; }

      # The same smoke test in Chromium emulating a phone (390x844, scale 3, touch), about 40 seconds more.
      - name: Boot smoke test, phone
        run: scripts/e2e-boot phone || { tail -40 out/e2e-boot-phone.log; exit 1; }

      - name: Keep the unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests
          path: |
            web/build/reports/tests/unitTest
            out/forge-tests.log
          if-no-files-found: ignore

      - name: Keep the boot smoke test's log and screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-boot
          path: |
            out/e2e-boot*.log
            out/e2e-boot*.png
          if-no-files-found: ignore
