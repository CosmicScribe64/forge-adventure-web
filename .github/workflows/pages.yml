# Builds the game from scratch and publishes it to GitHub Pages. Runs for each published release,
# and on demand from the Actions tab. The build steps are the same as in README.md.
name: Deploy to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A full build takes 20-40 minutes here; most of it is TeaVM compiling Forge.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Clone Forge and apply the patch
        run: scripts/update-forge

      - name: Build Forge's jars
        run: scripts/build-forge-libs

      - name: Prepare the game data
        run: scripts/build-webdata

      # The release is minified (TEAVM_OBFUSCATED=true), which breaks code that depends on Java
      # names, so everything below runs against the minified build before anything is deployed.
      - name: SelfTest, minified
        run: TEAVM_OBFUSCATED=true scripts/selftest || { tail -60 out/selftest-js.log; exit 1; }

      - name: Compile to JavaScript, minified, with a source map
        run: TEAVM_OBFUSCATED=true TEAVM_SOURCE_MAP=true scripts/build-web || { tail -40 web/build/teavm.log; exit 1; }

      - name: Assemble the site
        run: scripts/build-site

      # The release checks load the assembled site, not the build folder: from a subpath
      # (/forge-adventure-web/) and with compression, as GitHub Pages serves it (scripts/serve-site). The
      # desktop, Chromium phone and WebKit iPhone modes each run e2e-boot and e2e-newgame, and e2e-cycle
      # runs on desktop. scripts/e2e-release prints a result line per run.
      - name: Release checks on the assembled site
        run: scripts/e2e-release site || { tail -40 out/release/*.out; exit 1; }

      - name: Keep the test logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-tests
          path: |
            out/selftest-js.log
            out/release/
            out/e2e-*.log
            out/e2e-*.png
          if-no-files-found: ignore

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/site

  # The assembled site (the github-pages artifact the build job uploaded) in Mobile Safari in the iOS Simulator
  # and in Chrome in an Android emulator (devices.yml, about 20 minutes, the two in parallel). NOT a gate: the deploy
  # does not wait for it, because this way of running it (the built folder, not a URL) has not been through a real
  # release yet; it runs beside the deploy and can only turn the run red. Make `deploy` need it once it has proven green
  # (wiki/concepts/e2e-tests.md). The live-site runs of the same workflow passed in both simulators.
  devices-built:
    needs: build
    uses: ./.github/workflows/devices.yml
    with:
      site_artifact: github-pages
      label: "-built"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After the deployment: load the live site in the desktop, Chromium phone and WebKit iPhone modes
  # (scripts/e2e-release live, e2e-boot in each). A failure here can't undo the deployment, but it turns
  # the run red the moment a release breaks on a phone. The URL gets the commit as a query parameter so a
  # CDN that caches by URL doesn't serve the previous release's page; the check is tried three times,
  # two minutes apart, because the CDN can take a while to serve the new files.
  verify-live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Boot the live site on desktop, phone and iPhone
        env:
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3; do
            E2E_CACHE_BUST="$GITHUB_SHA-$attempt" scripts/e2e-release live && exit 0
            echo "Attempt $attempt failed."
            [ "$attempt" = 3 ] || sleep 120
          done
          exit 1

      - name: Keep the logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-tests
          path: |
            out/release/
            out/e2e-*.log
            out/e2e-*.png
          if-no-files-found: ignore

  # The live site in the same two device simulators, once the desktop, phone and iPhone checks above passed (so
  # the CDN serves the new files).
  devices-live:
    needs: [deploy, verify-live]
    uses: ./.github/workflows/devices.yml
    with:
      site_url: ${{ needs.deploy.outputs.page_url }}
      label: "-live"
